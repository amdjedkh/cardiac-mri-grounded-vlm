<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cardiac MRI Review</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f25;
    --border: #2c313a;
    --text: #e8e9eb;
    --text-dim: #9aa0ab;
    --accent: #5b9bd5;
    --accept: #3ba55c;
    --reject: #d9534f;
    --mono: "SF Mono", "Consolas", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
  }
  .layout {
    display: grid;
    grid-template-rows: auto 1fr;
    grid-template-columns: 280px 1fr 340px;
    height: 100vh;
  }
  .layout > .sidebar, .layout > .viewer, .layout > .review-panel {
    grid-row: 2;
  }
  .sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 20px;
    overflow-y: auto;
  }
  .sidebar h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 4px 0;
  }
  .sidebar .subtitle {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 20px;
  }
  .case-list-item {
    padding: 9px 10px;
    border-radius: 5px;
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 2px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--text-dim);
  }
  .case-list-item:hover { background: #23262d; }
  .case-list-item.active { background: #262b35; color: var(--text); }
  .case-list-item .tag {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 3px;
    background: #333844;
    color: var(--text-dim);
  }
  .case-list-item .tag.synthetic { background: #3a2d1f; color: #d9a760; }
  .case-list-item.status-pending { color: var(--text-dim); }
  .case-list-item.status-accepted { color: var(--accept); }
  .case-list-item.status-rejected { color: var(--reject); }
  .case-list-item .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 8px;
    background: #555;
  }
  .status-accepted .status-dot { background: var(--accept); }
  .status-rejected .status-dot { background: var(--reject); }

  .summary-bar {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 18px;
    font-size: 12.5px;
    grid-column: 1 / -1;
  }
  .summary-bar .stat { color: var(--text-dim); }
  .summary-bar .stat b { color: var(--text); font-weight: 600; }
  .summary-bar .stat.accepted b { color: var(--accept); }
  .summary-bar .stat.rejected b { color: var(--reject); }
  .export-btn {
    margin-left: auto;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 6px 12px;
    border-radius: 5px;
    font-size: 12px;
    cursor: pointer;
  }
  .export-btn:hover { border-color: var(--accent); color: var(--text); }
  .shortcut-hint {
    font-size: 11px;
    color: #555;
    font-family: var(--mono);
  }

  .viewer {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
  }
  .viewer img {
    max-height: 78vh;
    max-width: 90%;
    border-radius: 4px;
    background: #0d0e10;
  }
  .viewer .empty {
    color: var(--text-dim);
    font-size: 14px;
  }
  .slice-controls {
    margin-top: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 90%;
    max-width: 480px;
  }
  .slice-controls input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
  }
  .slice-controls .slice-label {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    min-width: 60px;
    text-align: center;
  }
  .toggle-row {
    margin-top: 12px;
    display: flex;
    gap: 8px;
  }
  .toggle-btn {
    background: #23262d;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 6px 14px;
    border-radius: 5px;
    font-size: 12px;
    cursor: pointer;
  }
  .toggle-btn.active {
    background: var(--accent);
    color: #0d0e10;
    border-color: var(--accent);
  }

  .review-panel {
    background: var(--panel);
    border-left: 1px solid var(--border);
    padding: 20px;
    display: flex;
    flex-direction: column;
  }
  .review-panel h2 {
    font-size: 13px;
    font-weight: 600;
    text-transform: none;
    color: var(--text-dim);
    margin: 0 0 14px 0;
  }
  .case-meta {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.7;
    margin-bottom: 18px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--border);
  }
  .decision-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .decision-btn {
    flex: 1;
    padding: 11px;
    border-radius: 6px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .decision-btn.accept.selected { background: var(--accept); border-color: var(--accept); }
  .decision-btn.reject.selected { background: var(--reject); border-color: var(--reject); }

  label.field-label {
    font-size: 12px;
    color: var(--text-dim);
    display: block;
    margin-bottom: 6px;
  }
  textarea {
    width: 100%;
    min-height: 110px;
    background: #14161a;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 10px;
    font-size: 13px;
    font-family: inherit;
    resize: vertical;
    margin-bottom: 16px;
  }
  .bbox-hint {
    font-size: 11.5px;
    color: var(--text-dim);
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .bbox-status {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--accent);
    margin-bottom: 16px;
  }
  .submit-btn {
    margin-top: auto;
    background: var(--accent);
    color: #0d0e10;
    border: none;
    padding: 13px;
    border-radius: 6px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .submit-btn:disabled {
    background: #333844;
    color: var(--text-dim);
    cursor: not-allowed;
  }
  .progress-note {
    font-size: 11.5px;
    color: var(--text-dim);
    margin-top: 10px;
    text-align: center;
  }
  .canvas-wrap {
    position: relative;
    display: inline-block;
  }
  .bbox-canvas {
    position: absolute;
    top: 0;
    left: 0;
    cursor: crosshair;
  }
</style>
</head>
<body>

<div class="layout">
  <div class="summary-bar">
    <span class="stat">Total: <b id="statTotal">0</b></span>
    <span class="stat accepted">Accepted: <b id="statAccepted">0</b></span>
    <span class="stat rejected">Rejected: <b id="statRejected">0</b></span>
    <span class="shortcut-hint">A accept &middot; R reject &middot; &#8592;&#8594; slice &middot; &#8593;&#8595; case</span>
    <button class="export-btn" id="exportBtn">Export accepted dataset</button>
  </div>
  <div class="sidebar">
    <h1>Cardiac MRI Review</h1>
    <div class="subtitle">Image validation</div>
    <div id="caseList"></div>
  </div>

  <div class="viewer">
    <div id="viewerContent">
      <div class="empty">Select a case from the list.</div>
    </div>
    <div class="slice-controls" id="sliceControls" style="display:none;">
      <span class="slice-label" id="sliceLabel">1 / 1</span>
      <input type="range" id="sliceSlider" min="0" max="0" value="0">
    </div>
    <div class="toggle-row" id="toggleRow" style="display:none;">
      <button class="toggle-btn active" id="maskToggle">Show mask</button>
      <button class="toggle-btn" id="bboxToggle">Mark region</button>
    </div>
  </div>

  <div class="review-panel">
    <h2>Decision</h2>
    <div class="case-meta" id="caseMeta">No case selected</div>

    <div class="decision-row">
      <button class="decision-btn accept" id="acceptBtn">Accept</button>
      <button class="decision-btn reject" id="rejectBtn">Reject</button>
    </div>

    <label class="field-label">Observations / comments</label>
    <textarea id="commentBox" placeholder="Anything worth noting about this case..."></textarea>

    <div class="bbox-hint">Click "Mark region" then click and drag on the image to flag a specific area, optional.</div>
    <div class="bbox-status" id="bboxStatus"></div>

    <button class="submit-btn" id="submitBtn" disabled>Save and next case</button>
    <div class="progress-note" id="progressNote"></div>
  </div>
</div>

<script>
let cases = [];
let currentCase = null;
let currentCaseIdx = -1;
let currentSliceIdx = 0;
let nSlices = 1;
let showMask = true;
let bboxMode = false;
let currentBbox = null;
let statusById = {};

async function refreshSummary() {
  const res = await fetch('/api/summary');
  const summary = await res.json();
  document.getElementById('statTotal').textContent = summary.total;
  document.getElementById('statAccepted').textContent = summary.counts.accepted;
  document.getElementById('statRejected').textContent = summary.counts.rejected;
  statusById = {};
  summary.cases.forEach(c => { statusById[c.type + ':' + c.id] = c.status; });
  return summary;
}

async function loadCases() {
  const res = await fetch('/api/cases');
  cases = await res.json();
  await refreshSummary();
  renderCaseList();
}

function renderCaseList() {
  const list = document.getElementById('caseList');
  list.innerHTML = '';
  cases.forEach((c, i) => {
    const status = statusById[c.type + ':' + c.id] || 'pending';
    const div = document.createElement('div');
    div.className = 'case-list-item status-' + status;
    if (currentCase && currentCase.id === c.id) div.classList.add('active');
    div.innerHTML = `<span><span class="status-dot"></span>${c.id}</span><span class="tag ${c.type}">${c.type}</span>`;
    div.onclick = () => selectCaseByIndex(i);
    list.appendChild(div);
  });
}

async function selectCaseByIndex(idx) {
  if (idx < 0 || idx >= cases.length) return;
  currentCaseIdx = idx;
  const c = cases[idx];
  currentCase = c;
  currentSliceIdx = 0;
  currentBbox = null;
  document.getElementById('bboxStatus').textContent = '';

  const infoRes = await fetch(`/api/case/${c.type}/${c.id}/info`);
  const info = await infoRes.json();
  if (info.error) {
    document.getElementById('viewerContent').innerHTML = `<div class="empty">Error loading case: ${info.error}</div>`;
    return;
  }
  nSlices = info.n_slices;
  currentSliceIdx = Math.floor(nSlices / 2);

  document.getElementById('caseMeta').innerHTML =
    `case: ${info.case_id}<br>type: ${info.case_type}<br>slices: ${info.n_slices}<br>shape: ${info.shape.join(' x ')}`;

  document.getElementById('sliceControls').style.display = 'flex';
  document.getElementById('toggleRow').style.display = 'flex';
  const slider = document.getElementById('sliceSlider');
  slider.min = 0;
  slider.max = nSlices - 1;
  slider.value = currentSliceIdx;

  // pre-fill with the existing decision if this case was already reviewed,
  // so revisiting and changing your mind is natural, not a blank slate
  const latestRes = await fetch(`/api/case/${c.type}/${c.id}/latest`);
  const latest = await latestRes.json();
  if (latest) {
    selectedDecision = latest.decision;
    document.getElementById('commentBox').value = latest.comment || '';
    currentBbox = latest.bbox || null;
    if (currentBbox) {
      document.getElementById('bboxStatus').textContent =
        `Region marked at (${currentBbox.x.toFixed(2)}, ${currentBbox.y.toFixed(2)})`;
    }
    document.getElementById('acceptBtn').classList.toggle('selected', latest.decision === 'accept');
    document.getElementById('rejectBtn').classList.toggle('selected', latest.decision === 'reject');
    document.getElementById('submitBtn').disabled = false;
  } else {
    resetDecision();
    document.getElementById('commentBox').value = '';
  }

  renderCaseList();
  updateSliceView();
}

function updateSliceView() {
  document.getElementById('sliceLabel').textContent = `${currentSliceIdx + 1} / ${nSlices}`;
  const url = `/api/case/${currentCase.type}/${currentCase.id}/slice/${currentSliceIdx}.png?mask=${showMask ? 1 : 0}&t=${Date.now()}`;

  const wrap = document.createElement('div');
  wrap.className = 'canvas-wrap';
  const img = document.createElement('img');
  img.src = url;
  img.id = 'sliceImg';
  wrap.appendChild(img);

  const canvas = document.createElement('canvas');
  canvas.className = 'bbox-canvas';
  canvas.id = 'bboxCanvas';
  wrap.appendChild(canvas);

  const content = document.getElementById('viewerContent');
  content.innerHTML = '';
  content.appendChild(wrap);

  img.onload = () => {
    canvas.width = img.clientWidth;
    canvas.height = img.clientHeight;
    canvas.style.width = img.clientWidth + 'px';
    canvas.style.height = img.clientHeight + 'px';
    setupBboxDrawing(canvas);
  };
}

function setupBboxDrawing(canvas) {
  const ctx = canvas.getContext('2d');
  let drawing = false;
  let startX, startY;

  canvas.onmousedown = (e) => {
    if (!bboxMode) return;
    const rect = canvas.getBoundingClientRect();
    startX = e.clientX - rect.left;
    startY = e.clientY - rect.top;
    drawing = true;
  };
  canvas.onmousemove = (e) => {
    if (!drawing) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#5b9bd5';
    ctx.lineWidth = 2;
    ctx.strokeRect(startX, startY, x - startX, y - startY);
  };
  canvas.onmouseup = (e) => {
    if (!drawing) return;
    drawing = false;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    currentBbox = {
      x: Math.min(startX, x) / canvas.width,
      y: Math.min(startY, y) / canvas.height,
      w: Math.abs(x - startX) / canvas.width,
      h: Math.abs(y - startY) / canvas.height,
    };
    document.getElementById('bboxStatus').textContent =
      `Region marked at (${currentBbox.x.toFixed(2)}, ${currentBbox.y.toFixed(2)})`;
  };
}

document.getElementById('sliceSlider').addEventListener('input', (e) => {
  currentSliceIdx = parseInt(e.target.value);
  updateSliceView();
});

document.getElementById('maskToggle').onclick = () => {
  showMask = !showMask;
  document.getElementById('maskToggle').classList.toggle('active', showMask);
  updateSliceView();
};

document.getElementById('bboxToggle').onclick = () => {
  bboxMode = !bboxMode;
  document.getElementById('bboxToggle').classList.toggle('active', bboxMode);
};

let selectedDecision = null;
function resetDecision() {
  selectedDecision = null;
  document.getElementById('acceptBtn').classList.remove('selected');
  document.getElementById('rejectBtn').classList.remove('selected');
  document.getElementById('submitBtn').disabled = true;
}
document.getElementById('acceptBtn').onclick = () => {
  selectedDecision = 'accept';
  document.getElementById('acceptBtn').classList.add('selected');
  document.getElementById('rejectBtn').classList.remove('selected');
  document.getElementById('submitBtn').disabled = false;
};
document.getElementById('rejectBtn').onclick = () => {
  selectedDecision = 'reject';
  document.getElementById('rejectBtn').classList.add('selected');
  document.getElementById('acceptBtn').classList.remove('selected');
  document.getElementById('submitBtn').disabled = false;
};

document.getElementById('submitBtn').onclick = async () => {
  if (!currentCase || !selectedDecision) return;
  const payload = {
    case_id: currentCase.id,
    case_type: currentCase.type,
    decision: selectedDecision,
    comment: document.getElementById('commentBox').value,
    bbox: currentBbox,
    slice_idx: currentSliceIdx,
  };
  const res = await fetch('/api/validate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  if (res.ok) {
    await refreshSummary();
    document.getElementById('progressNote').textContent =
      `Saved. ${statusById[currentCase.type + ':' + currentCase.id]}.`;
    if (currentCaseIdx + 1 < cases.length) {
      selectCaseByIndex(currentCaseIdx + 1);
    } else {
      document.getElementById('viewerContent').innerHTML = '<div class="empty">All cases reviewed. You can still click any case on the left to revisit it.</div>';
      renderCaseList();
    }
  }
};

document.getElementById('exportBtn').onclick = async () => {
  const res = await fetch('/api/export');
  const data = await res.json();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `accepted_dataset_manifest_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
};

document.addEventListener('keydown', (e) => {
  const tag = document.activeElement.tagName;
  if (tag === 'TEXTAREA' || tag === 'INPUT') return; // don't hijack typing
  if (!currentCase) return;

  if (e.key === 'a' || e.key === 'A') {
    document.getElementById('acceptBtn').click();
  } else if (e.key === 'r' || e.key === 'R') {
    document.getElementById('rejectBtn').click();
  } else if (e.key === 'ArrowLeft') {
    if (currentSliceIdx > 0) { currentSliceIdx--; document.getElementById('sliceSlider').value = currentSliceIdx; updateSliceView(); }
  } else if (e.key === 'ArrowRight') {
    if (currentSliceIdx < nSlices - 1) { currentSliceIdx++; document.getElementById('sliceSlider').value = currentSliceIdx; updateSliceView(); }
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    selectCaseByIndex(currentCaseIdx - 1);
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    selectCaseByIndex(currentCaseIdx + 1);
  } else if (e.key === 'Enter') {
    if (!document.getElementById('submitBtn').disabled) document.getElementById('submitBtn').click();
  }
});

loadCases();
</script>
</body>
</html>
